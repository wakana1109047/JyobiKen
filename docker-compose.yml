services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jyobiken
      POSTGRES_USER: jyobiken_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - app_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/create-app-user.sh:/docker-entrypoint-initdb.d/10-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - database

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_USERNAME: jyobiken_app
    user: "${APP_UID:?Set APP_UID in JyobiKen/.env}:${APP_GID:?Set APP_GID in JyobiKen/.env}"
    secrets:
      - source: app_db_password
        target: spring.datasource.password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - database

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in JyobiKen/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app  # ← condition を外し、app コンテナが起動したらすぐに Caddy も起動させる
    networks:
      - proxy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  app_db_password:
    file: ./secrets/app_db_password.txt

networks:
  proxy:
  database:
    internal: true
