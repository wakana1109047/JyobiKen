
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>卒研詳細 | JyobiKen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #f3f6f9;
            color: #333;
            font-family: Arial, "Meiryo", sans-serif;
        }

        .sidebar {
            width: 190px;
            min-width: 190px;
            min-height: 100vh;
            padding: 22px 15px;
            background: white;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .sidebar .nav-link {
            color: #555;
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
        }

        .sidebar .nav-link:hover {
            color: #2996d6;
            background: #eaf6fd;
        }

        .logout {
            margin-top: auto;
            padding-top: 25px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .page-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .content-card {
            max-width: 850px;
            background: white;
            border: 1px solid #edf0f3;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,.04);
        }

        .research-image {
            min-height: 220px;
            background: #e5e7eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #666;
            margin-bottom: 24px;
        }

        .research-title {
            font-size: 22px;
            font-weight: bold;
        }

        .research-meta {
            color: #777;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .member-chip {
            background: #f0f4f7;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
        }

        .research-description {
            background: #f7f9fb;
            border-radius: 8px;
            padding: 24px;
            min-height: 150px;
            line-height: 1.8;
        }

        @media (max-width: 767.98px) {
            .sidebar {
                width: 100%;
                min-width: 0;
                min-height: auto;
                border-right: 0;
                border-bottom: 1px solid #e5e7eb;
            }

            .logo { margin-bottom: 12px; }
            .sidebar .nav { flex-direction: row; flex-wrap: wrap; }
            .logout { padding-top: 10px; }
            .main-content { padding: 20px 15px; }
            .content-card { padding: 18px; }
        }
    </style>
</head>

<body>
<div class="d-flex flex-column flex-md-row">

    <aside class="sidebar">
        <a href="admin-home.html" class="logo">JyobiKen</a>
        <nav class="nav flex-column">
            <a href="research-list.html" class="nav-link">卒業研究一覧</a>
            <a href="admin-accounts.html" class="nav-link">アカウント管理</a>
            <a href="timeline.html" class="nav-link">タイムライン</a>
            <a href="notifications.html" class="nav-link">通知</a>
        </nav>
        <div class="logout">
            <a href="login.html" class="btn btn-outline-secondary btn-sm w-100">ログアウト →</a>
        </div>
    </aside>

    <main class="main-content">
        <h1 class="page-title">卒研詳細</h1>

        <section class="content-card">
            <a href="research-list.html" class="text-primary text-decoration-none small">
                ← 戻る
            </a>

            <div class="research-image mt-3">画像など</div>

            <h2 class="research-title">研究概要</h2>

            <p class="research-meta">
                グループA　2027年度卒業研究
            </p>

            <div class="mb-4">
                <h3 class="h6 fw-bold">タイトル</h3>
                <p class="mb-0">研究概要</p>
            </div>

            <div class="mb-4">
                <h3 class="h6 fw-bold">メンバー</h3>
                <div class="d-flex flex-wrap gap-2">
                    <span class="member-chip">👤 山田花子</span>
                    <span class="member-chip">👤 山田花子</span>
                    <span class="member-chip">👤 山田花子</span>
                    <span class="member-chip">👤 山田花子</span>
                    <span class="member-chip">👤 山田花子</span>
                </div>
            </div>

            <div class="research-description mb-4">
                研究内容や概要をここに表示します。
            </div>

            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a href="admin-research-edit.html" class="btn btn-success px-4">
                    編集
                </a>

                <button type="button" id="delete-research" class="btn btn-danger px-4">
                    削除
                </button>
            </div>
        </section>
    </main>
</div>

<script>
    document.getElementById("delete-research").addEventListener("click", function () {
        if (confirm("この卒業研究を削除しますか？")) {
            window.location.href = "research-list.html";
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
