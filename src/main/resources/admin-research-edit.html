
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>卒研詳細編集 | JyobiKen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #f3f6f9;
            color: #333;
            font-family: Arial, "Meiryo", sans-serif;
        }

        .sidebar {
            width: 190px;
            min-width: 190px;
            min-height: 100vh;
            padding: 22px 15px;
            background: white;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .sidebar .nav-link {
            color: #555;
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
        }

        .sidebar .nav-link:hover {
            color: #2996d6;
            background: #eaf6fd;
        }

        .logout {
            margin-top: auto;
            padding-top: 25px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .page-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .content-card {
            max-width: 850px;
            background: white;
            border: 1px solid #edf0f3;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,.04);
        }

        .form-label {
            font-size: 14px;
            font-weight: bold;
        }

        .form-control {
            border-color: #d1d5db;
            border-radius: 6px;
        }

        .form-control:focus {
            border-color: #42a9e8;
            box-shadow: 0 0 0 3px rgba(66,169,232,.15);
        }

        .image-preview {
            min-height: 180px;
            background: #e5e7eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            margin-bottom: 16px;
        }

        .member-chip {
            background: #f0f4f7;
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 13px;
        }

        .btn-primary {
            background: #42a9e8;
            border-color: #42a9e8;
        }

        .btn-primary:hover {
            background: #2996d6;
            border-color: #2996d6;
        }

        @media (max-width: 767.98px) {
            .sidebar {
                width: 100%;
                min-width: 0;
                min-height: auto;
                border-right: 0;
                border-bottom: 1px solid #e5e7eb;
            }

            .logo { margin-bottom: 12px; }
            .sidebar .nav { flex-direction: row; flex-wrap: wrap; }
            .logout { padding-top: 10px; }
            .main-content { padding: 20px 15px; }
            .content-card { padding: 18px; }
        }
    </style>
</head>

<body>
<div class="d-flex flex-column flex-md-row">

    <aside class="sidebar">
        <a href="admin-home.html" class="logo">JyobiKen</a>
        <nav class="nav flex-column">
            <a href="research-list.html" class="nav-link">卒業研究一覧</a>
            <a href="admin-accounts.html" class="nav-link">アカウント管理</a>
            <a href="timeline.html" class="nav-link">タイムライン</a>
            <a href="notifications.html" class="nav-link">通知</a>
        </nav>
        <div class="logout">
            <a href="login.html" class="btn btn-outline-secondary btn-sm w-100">ログアウト →</a>
        </div>
    </aside>

    <main class="main-content">
        <h1 class="page-title">詳細編集</h1>

        <section class="content-card">
            <a href="admin-research-detail.html" class="text-primary text-decoration-none small">
                ← 戻る
            </a>

            <form id="edit-form" class="mt-4">

                <div class="mb-4">
                    <label for="image" class="form-label">画像</label>
                    <div class="image-preview" id="image-preview">画像など</div>
                    <input type="file" id="image" class="form-control" accept="image/*">
                </div>

                <div class="mb-4">
                    <label for="title" class="form-label">タイトル</label>
                    <input type="text" id="title" class="form-control"
                           value="研究概要" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">グループ</label>
                    <input type="text" class="form-control" value="グループA" readonly>
                </div>

                <div class="mb-4">
                    <label class="form-label">メンバー</label>
                    <div class="d-flex flex-wrap gap-2">
                        <span class="member-chip">👤 山田花子</span>
                        <span class="member-chip">👤 山田花子</span>
                        <span class="member-chip">👤 山田花子</span>
                        <span class="member-chip">👤 山田花子</span>
                        <span class="member-chip">👤 山田花子</span>
                    </div>
                    <small class="text-secondary">
                        メンバーの変更は管理者設定から行います。
                    </small>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label">研究内容</label>
                    <textarea id="description" class="form-control" rows="5">研究内容を入力してください。</textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 flex-wrap">
                    <a href="admin-research-detail.html"
                       class="btn btn-outline-secondary">
                        キャンセル
                    </a>

                    <button type="submit" class="btn btn-primary">
                        変更を保存
                    </button>
                </div>

            </form>
        </section>
    </main>
</div>

<script>
    const imageInput = document.getElementById("image");
    const imagePreview = document.getElementById("image-preview");

    imageInput.addEventListener("change", function () {
        const file = imageInput.files[0];

        if (!file) {
            imagePreview.textContent = "画像など";
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {
            imagePreview.style.backgroundImage = "url('" + event.target.result + "')";
            imagePreview.style.backgroundSize = "contain";
            imagePreview.style.backgroundPosition = "center";
            imagePreview.style.backgroundRepeat = "no-repeat";
            imagePreview.textContent = "";
        };

        reader.readAsDataURL(file);
    });

    document.getElementById("edit-form").addEventListener("submit", function (event) {
        event.preventDefault();
        alert("画面デザインのサンプルです。保存処理はまだ実装されていません。");
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
