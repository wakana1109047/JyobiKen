spring.application.name=JyobiKen

# 1. データベース接続（DockerのPostgreSQLコンテナ "db" に接続）
spring.datasource.url=jdbc:postgresql://db:5432/jyobiken_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=jyobiken_user
spring.datasource.password=jyobiken_password

# 2. H2 Console（PostgreSQL使用時は不要のため無効化）
spring.h2.console.enabled=false

# 3. SQL初期化設定（PostgreSQL用）
spring.sql.init.mode=always
spring.sql.init.platform=postgres

# 4. Thymeleaf設定（templates/ 配下を参照するように修復）
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# 5. Actuator（ヘルスチェック用）
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized