<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JyobiKen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f7fb;
            color: #1f2937;
        }
        .card {
            max-width: 720px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 32px;
        }
        h1 { margin-top: 0; }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        a.button {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
        }
        a.secondary {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>JyobiKen</h1>
        <p>ようこそ。ホーム画面です。</p>
        <div class="actions">
            <a class="button" href="/login">ログイン</a>
            <a class="button secondary" href="/register">新規登録</a>
        </div>
    </div>
</body>
</html>
