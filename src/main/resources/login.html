
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | JyobiKen</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --main-blue: #42a9e8;
            --hover-blue: #2996d6;
        }

        body {
            margin: 0;
            font-family: Arial, "Meiryo", sans-serif;
            background-color: #f3f6f9;
            color: #333;
        }

        header {
            background: #fff;
            padding: 20px 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .login-area {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .06);
        }

        .login-title {
            font-size: 25px;
            font-weight: bold;
        }

        .description {
            color: #777;
            font-size: 14px;
        }

        .form-control {
            min-height: 44px;
            border-color: #d1d5db;
            border-radius: 6px;
        }

        .form-control:focus {
            border-color: var(--main-blue);
            box-shadow: 0 0 0 .2rem rgba(66, 169, 232, .15);
        }

        .btn-primary {
            min-height: 46px;
            background: var(--main-blue);
            border-color: var(--main-blue);
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: var(--hover-blue);
            border-color: var(--hover-blue);
        }

        .register-link {
            color: var(--hover-blue);
            font-weight: bold;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            header {
                padding: 18px 20px;
            }

            .login-card .card-body {
                padding: 30px 24px !important;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">JyobiKen</div>
    </header>

    <main class="login-area">
        <div class="card login-card">
            <div class="card-body p-5">

                <h1 class="login-title text-center mb-2">
                    ログイン
                </h1>

                <p class="description text-center mb-4">
                    アカウントにログインしてください
                </p>

                <form id="loginForm">

                    <div class="mb-4">
                        <label for="email" class="form-label fw-bold">
                            メールアドレス
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">
                            パスワード
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="パスワードを入力"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        ログイン
                    </button>

                </form>

                <div class="text-center mt-4">
                    <p class="text-secondary small mb-2">
                        アカウントをお持ちでない方は
                    </p>

                    <a href="register.html" class="register-link">
                        新規登録はこちら →
                    </a>
                </div>

            </div>
        </div>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            // 画面遷移の動作確認用
            window.location.href = "index.html";
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
