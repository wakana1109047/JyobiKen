<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | JyobiKen</title>

    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">

    <style>
        :root {
            --main-blue: #42a9e8;
            --hover-blue: #2996d6;
            --background: #f3f6f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans JP", "Meiryo", sans-serif;
            background: var(--background);
            color: #333;
        }

        header {
            background: #fff;
            padding: 20px 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: var(--main-blue);
            text-decoration: none;
        }

        .login-area {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: 1px solid #edf0f3;
            border-radius: 15px;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .login-title {
            font-size: 26px;
            font-weight: bold;
        }

        .description {
            color: #777;
            font-size: 14px;
        }

        .form-label {
            font-size: 14px;
        }

        .form-control {
            min-height: 46px;
            border-color: #d1d5db;
            border-radius: 9px;
        }

        .form-control:focus {
            border-color: var(--main-blue);
            box-shadow: 0 0 0 3px rgba(66, 169, 232, 0.15);
        }

        .btn-primary {
            min-height: 46px;
            background: var(--main-blue);
            border-color: var(--main-blue);
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: var(--hover-blue);
            border-color: var(--hover-blue);
        }

        .register-link {
            color: var(--hover-blue);
            font-weight: bold;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            header {
                padding: 18px 20px;
            }

            .login-area {
                padding: 25px 15px;
            }

            .login-card .card-body {
                padding: 30px 24px !important;
            }

            .login-title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="/login" class="logo">JyobiKen</a>
    </header>

    <main class="login-area">

        <div class="card login-card">

            <div class="card-body p-5">

                <h1 class="login-title text-center mb-2">
                    ログイン
                </h1>

                <p class="description text-center mb-4">
                    アカウントにログインしてください
                </p>

                <!-- Spring Securityのメッセージ -->
                <div class="alert alert-danger" role="alert" th:if="${param.error}">
                    メールアドレスまたはパスワードが正しくありません。
                </div>

                <div class="alert alert-success" role="status" th:if="${param.registered}">
                    アカウントを作成しました。ログインしてください。
                </div>

                <div class="alert alert-info" role="status" th:if="${param.logout}">
                    ログアウトしました。
                </div>

                <div class="alert alert-warning" role="alert" th:if="${param.reauth}">
                    アカウントの状態または権限が変更されました。もう一度ログインしてください。
                </div>

                <!-- ログインフォーム -->
                <form th:action="@{/login}" method="post">

                    <div class="mb-4">

                        <label for="email" class="form-label fw-bold">
                            メールアドレス
                        </label>

                        <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com"
                            autocomplete="email" required>

                    </div>

                    <div class="mb-4">

                        <label for="password" class="form-label fw-bold">
                            パスワード
                        </label>

                        <input type="password" class="form-control" id="password" name="password" placeholder="パスワードを入力"
                            autocomplete="current-password" required>

                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        ログイン
                    </button>

                </form>

                <!-- 新規登録リンク -->
                <div class="text-center mt-4">

                    <p class="text-secondary small mb-2">
                        アカウントをお持ちでない方は
                    </p>

                    <a href="/register" class="register-link">
                        新規登録はこちら →
                    </a>

                </div>

            </div>

        </div>

    </main>

    <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
