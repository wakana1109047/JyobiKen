<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | JyobiKen</title>

    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">

    <style>
        :root {
            --main-blue: #42a9e8;
            --hover-blue: #2996d6;
            --background: #f3f6f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans JP", "Meiryo", sans-serif;
            background: var(--background);
            color: #333;
        }

        /* ヘッダー */
        header {
            background: #fff;
            padding: 20px 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: var(--main-blue);
            text-decoration: none;
        }

        /* ログインエリア */
        .login-area {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* ログインカード */
        .login-card {
            width: 100%;
            max-width: 420px;
            border: 1px solid #edf0f3;
            border-radius: 15px;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .login-title {
            font-size: 26px;
            font-weight: bold;
        }

        .description {
            color: #777;
            font-size: 14px;
        }

        /* 入力欄 */
        .form-label {
            font-size: 14px;
        }

        .form-control {
            min-height: 46px;
            border-color: #d1d5db;
            border-radius: 9px;
        }

        .form-control:focus {
            border-color: var(--main-blue);
            box-shadow: 0 0 0 3px rgba(66, 169, 232, 0.15);
        }

        /* ログインボタン */
        .btn-primary {
            min-height: 46px;
            background: var(--main-blue);
            border-color: var(--main-blue);
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: var(--hover-blue);
            border-color: var(--hover-blue);
        }

        /* 新規登録リンク */
        .register-link {
            color: var(--hover-blue);
            font-weight: bold;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        /* スマホ表示 */
        @media (max-width: 480px) {
            header {
                padding: 18px 20px;
            }

            .login-area {
                padding: 25px 15px;
            }

            .login-card .card-body {
                padding: 30px 24px !important;
            }

            .login-title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <a href="login.html" class="logo">
            JyobiKen
        </a>
    </header>

    <!-- React表示エリア -->
    <div id="root"></div>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ログイン画面 -->
    <script type="text/babel">

        const { useState } = React;

        function Login() {

            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");

            // ログイン処理
            const handleSubmit = async (event) => {

                event.preventDefault();
                setError("");

                // メールアドレスの入力チェック
                if (!email.trim()) {
                    setError("メールアドレスを入力してください。");
                    return;
                }

                // パスワードの入力チェック
                if (!password) {
                    setError("パスワードを入力してください。");
                    return;
                }

                // ログイン成功時の画面遷移（動作確認用）
                window.location.href = "research-list.html";
            };

            return (
                <main className="login-area">

                    <div className="card login-card">

                        <div className="card-body p-5">

                            <h1 className="login-title text-center mb-2">
                                ログイン
                            </h1>

                            <p className="description text-center mb-4">
                                アカウントにログインしてください
                            </p>

                            {/* エラーメッセージ */}
                            {error && (
                                <div className="alert alert-danger text-center mb-4"
                                    role="alert">
                                    {error}
                                </div>
                            )}

                            <form onSubmit={handleSubmit}>

                                {/* メールアドレス */}
                                <div className="mb-4">

                                    <label htmlFor="email"
                                        className="form-label fw-bold">
                                        メールアドレス
                                    </label>

                                    <input
                                        type="email"
                                        className="form-control"
                                        id="email"
                                        name="email"
                                        placeholder="example@email.com"
                                        autoComplete="email"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        required
                                    />

                                </div>

                                {/* パスワード */}
                                <div className="mb-4">

                                    <label htmlFor="password"
                                        className="form-label fw-bold">
                                        パスワード
                                    </label>

                                    <input
                                        type="password"
                                        className="form-control"
                                        id="password"
                                        name="password"
                                        placeholder="パスワードを入力"
                                        autoComplete="current-password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        required
                                    />

                                </div>

                                {/* ログインボタン */}
                                <button type="submit"
                                    className="btn btn-primary w-100">
                                    ログイン
                                </button>

                            </form>

                            {/* 新規登録リンク */}
                            <div className="text-center mt-4">

                                <p className="text-secondary small mb-2">
                                    アカウントをお持ちでない方は
                                </p>

                                <a href="register.html"
                                    className="register-link">
                                    新規登録はこちら →
                                </a>

                            </div>

                        </div>

                    </div>

                </main>
            );
        }

        // React画面の表示
        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<Login />);

    </script>

    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
