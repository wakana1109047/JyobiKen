
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>通知詳細 | JyobiKen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --main-blue: #42a9e8;
            --hover-blue: #2996d6;
        }

        body {
            margin: 0;
            background: #f3f6f9;
            color: #333;
            font-family: Arial, "Meiryo", sans-serif;
        }

        .sidebar {
            width: 190px;
            min-width: 190px;
            min-height: 100vh;
            background: #fff;
            border-right: 1px solid #e5e7eb;
            padding: 22px 15px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .sidebar .nav-link {
            color: #555;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: var(--hover-blue);
            background: #eaf6fd;
        }

        .logout {
            margin-top: auto;
            padding-top: 25px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .page-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .content-card {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #edf0f3;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 25px;
        }

        .back-link {
            color: var(--hover-blue);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .notification-icon {
            width: 48px;
            height: 48px;
            background: #e5e7eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            flex-shrink: 0;
        }

        .notification-title {
            font-size: 18px;
            font-weight: bold;
        }

        .notification-date {
            color: #888;
            font-size: 12px;
        }

        .notification-message {
            font-size: 14px;
            line-height: 1.9;
            margin: 24px 0;
        }

        .post-preview {
            background: #e5e7eb;
            min-height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            color: #666;
            font-size: 20px;
        }

        .btn-primary {
            background: var(--main-blue);
            border-color: var(--main-blue);
        }

        .btn-primary:hover {
            background: var(--hover-blue);
            border-color: var(--hover-blue);
        }

        @media (max-width: 767.98px) {
            .sidebar {
                width: 100%;
                min-width: 0;
                min-height: auto;
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }

            .logo {
                margin-bottom: 12px;
            }

            .sidebar .nav {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .logout {
                padding-top: 10px;
            }

            .main-content {
                padding: 20px 15px;
            }

            .content-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="d-flex flex-column flex-md-row">

    <!-- 左側メニュー -->
    <aside class="sidebar">
        <a href="#" class="logo">JyobiKen</a>

        <nav class="nav flex-column">
            <a href="research-list.html" class="nav-link">
                卒業研究一覧
            </a>
            <a href="mypage.html" class="nav-link">
                マイページ
            </a>
            <a href="timeline.html" class="nav-link">
                タイムライン
            </a>
            <a href="notifications.html" class="nav-link active">
                通知
            </a>
        </nav>

        <div class="logout">
            <a href="login.html"
               class="btn btn-outline-secondary btn-sm w-100">
                ログアウト →
            </a>
        </div>
    </aside>

    <!-- 通知詳細 -->
    <main class="main-content">

        <h1 class="page-title">通知詳細</h1>

        <section class="content-card">

            <a href="notifications.html" class="back-link">
                ← 戻る
            </a>

            <div class="d-flex align-items-center gap-3 mt-4">

                <div class="notification-icon">👤</div>

                <div>
                    <h2 class="notification-title mb-1">
                        いいねされました
                    </h2>

                    <p class="notification-date mb-0">
                        2026年10月27日 09:30
                    </p>
                </div>

            </div>

            <p class="notification-message">
                あなたの投稿が○○さんに「いいね」されました。
            </p>

            <div class="border rounded-3 p-3">

                <h3 class="fs-6 fw-bold mb-3">
                    対象の投稿
                </h3>

                <div class="post-preview">
                    自分の投稿
                </div>

                <p class="text-secondary small mt-3 mb-0">
                    卒業研究の日誌投稿
                </p>

            </div>

            <div class="text-end mt-4">
                <a href="notifications.html"
                   class="btn btn-primary">
                    通知一覧に戻る
                </a>
            </div>

        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
