
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>通知 | JyobiKen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --main-blue: #42a9e8;
            --hover-blue: #2996d6;
        }

        body {
            margin: 0;
            background: #f3f6f9;
            color: #333;
            font-family: Arial, "Meiryo", sans-serif;
        }

        .sidebar {
            width: 190px;
            min-width: 190px;
            min-height: 100vh;
            background: #fff;
            border-right: 1px solid #e5e7eb;
            padding: 22px 15px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .sidebar .nav-link {
            color: #555;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: var(--hover-blue);
            background: #eaf6fd;
        }

        .logout {
            margin-top: auto;
            padding-top: 25px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .page-title {
            font-size: 25px;
            font-weight: bold;
        }

        .content-card {
            background: #fff;
            border: 1px solid #edf0f3;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
        }

        .btn-primary {
            background: var(--main-blue);
            border-color: var(--main-blue);
        }

        .btn-primary:hover {
            background: var(--hover-blue);
            border-color: var(--hover-blue);
        }

        .filter-button {
            background: #fff;
            border: 1px solid #d1d5db;
            color: #555;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
        }

        .filter-button.active {
            background: #eaf6fd;
            border-color: var(--main-blue);
            color: var(--hover-blue);
        }

        .notification-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            text-decoration: none;
            color: #333;
            border-bottom: 1px solid #edf0f3;
            transition: background 0.2s;
        }

        .notification-item:last-child {
            border-bottom: none;
        }

        .notification-item:hover {
            background: #f7fbfe;
        }

        .notification-item.unread {
            background: #f2f9fe;
        }

        .notification-icon {
            width: 42px;
            height: 42px;
            min-width: 42px;
            background: #e5e7eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .notification-text {
            flex: 1;
            min-width: 0;
        }

        .notification-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .notification-message {
            font-size: 12px;
            color: #777;
            margin-bottom: 5px;
        }

        .notification-date {
            font-size: 11px;
            color: #999;
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            background: var(--main-blue);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .arrow {
            color: #999;
            font-size: 20px;
        }

        @media (max-width: 767.98px) {
            .sidebar {
                width: 100%;
                min-width: 0;
                min-height: auto;
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }

            .logo {
                margin-bottom: 12px;
            }

            .sidebar .nav {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .logout {
                padding-top: 10px;
            }

            .main-content {
                padding: 20px 15px;
            }
        }
    </style>
</head>

<body>

<div class="d-flex flex-column flex-md-row">

    <!-- 左側メニュー -->
    <aside class="sidebar">
        <a href="#" class="logo">JyobiKen</a>

        <nav class="nav flex-column">
            <a href="index.html" class="nav-link">
                卒業研究一覧
            </a>
            <a href="mypage.html" class="nav-link">
                マイページ
            </a>
            <a href="timeline.html" class="nav-link">
                タイムライン
            </a>
            <a href="notifications.html" class="nav-link active">
                通知
            </a>
        </nav>

        <div class="logout">
            <a href="login.html"
               class="btn btn-outline-secondary btn-sm w-100">
                ログアウト →
            </a>
        </div>
    </aside>

    <!-- 通知一覧 -->
    <main class="main-content">

        <div class="d-flex justify-content-between
                    align-items-center flex-wrap gap-3 mb-4">

            <h1 class="page-title mb-0">通知</h1>

            <button type="button"
                    id="read-all"
                    class="btn btn-outline-primary btn-sm">
                すべて既読にする
            </button>
        </div>

        <!-- 絞り込み -->
        <div class="d-flex gap-2 mb-3">
            <button type="button"
                    class="filter-button active"
                    data-filter="all">
                すべて
            </button>

            <button type="button"
                    class="filter-button"
                    data-filter="unread">
                未読
            </button>
        </div>

        <!-- 通知リスト -->
        <section class="content-card" id="notification-list">

            <a href="notification-detail.html?id=1"
               class="notification-item unread"
               data-read="false">

                <div class="notification-icon">👤</div>

                <div class="notification-text">
                    <div class="notification-title">
                        いいねされました
                    </div>
                    <p class="notification-message">
                        ○○さんがあなたの投稿に「いいね」しました。
                    </p>
                    <div class="notification-date">
                        2026年10月27日 09:30
                    </div>
                </div>

                <span class="unread-dot"></span>
                <span class="arrow">›</span>
            </a>

            <a href="notification-detail.html?id=2"
               class="notification-item unread"
               data-read="false">

                <div class="notification-icon">👤</div>

                <div class="notification-text">
                    <div class="notification-title">
                        いいねされました
                    </div>
                    <p class="notification-message">
                        ○○さんがあなたの投稿に「いいね」しました。
                    </p>
                    <div class="notification-date">
                        2026年10月26日 15:20
                    </div>
                </div>

                <span class="unread-dot"></span>
                <span class="arrow">›</span>
            </a>

            <a href="notification-detail.html?id=3"
               class="notification-item"
               data-read="true">

                <div class="notification-icon">👤</div>

                <div class="notification-text">
                    <div class="notification-title">
                        いいねされました
                    </div>
                    <p class="notification-message">
                        ○○さんがあなたの投稿に「いいね」しました。
                    </p>
                    <div class="notification-date">
                        2026年10月25日 12:00
                    </div>
                </div>

                <span class="arrow">›</span>
            </a>

        </section>

        <p id="empty-message"
           class="text-center text-secondary mt-4 d-none">
            通知はありません。
        </p>

    </main>

</div>

<script>
    const filterButtons = document.querySelectorAll(".filter-button");
    const notificationItems = document.querySelectorAll(".notification-item");
    const emptyMessage = document.getElementById("empty-message");

    let currentFilter = "all";

    function updateNotifications() {
        let visibleCount = 0;

        notificationItems.forEach(function(item) {
            const isUnread = item.dataset.read === "false";
            const visible = currentFilter === "all" || isUnread;

            item.classList.toggle("d-none", !visible);

            if (visible) {
                visibleCount++;
            }
        });

        emptyMessage.classList.toggle("d-none", visibleCount > 0);
    }

    filterButtons.forEach(function(button) {
        button.addEventListener("click", function() {
            currentFilter = button.dataset.filter;

            filterButtons.forEach(function(item) {
                item.classList.remove("active");
            });

            button.classList.add("active");
            updateNotifications();
        });
    });

    document.getElementById("read-all").addEventListener("click", function() {
        notificationItems.forEach(function(item) {
            item.dataset.read = "true";
            item.classList.remove("unread");

            const dot = item.querySelector(".unread-dot");
            if (dot) {
                dot.remove();
            }
        });

        updateNotifications();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
