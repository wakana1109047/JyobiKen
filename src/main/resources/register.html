<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新規登録 | JyobiKen</title>

    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">

    <style>
        :root {
            --main-blue: #42a9e8;
            --hover-blue: #2996d6;
            --background: #f3f6f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans JP", "Meiryo", sans-serif;
            background: var(--background);
            color: #333;
        }

        header {
            background: #fff;
            padding: 20px 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: var(--main-blue);
            text-decoration: none;
        }

        .register-area {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            border: 1px solid #edf0f3;
            border-radius: 15px;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .register-title {
            font-size: 26px;
            font-weight: bold;
        }

        .description {
            color: #777;
            font-size: 14px;
        }

        .form-label {
            font-size: 14px;
        }

        .form-control {
            min-height: 46px;
            border-color: #d1d5db;
            border-radius: 9px;
        }

        .form-control:focus {
            border-color: var(--main-blue);
            box-shadow: 0 0 0 3px rgba(66, 169, 232, 0.15);
        }

        .form-check-input {
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: var(--main-blue);
            border-color: var(--main-blue);
        }

        .btn-primary {
            min-height: 46px;
            background: var(--main-blue);
            border-color: var(--main-blue);
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: var(--hover-blue);
            border-color: var(--hover-blue);
        }

        .login-link {
            color: var(--hover-blue);
            font-weight: bold;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            header {
                padding: 18px 20px;
            }

            .register-area {
                padding: 25px 15px;
            }

            .register-card .card-body {
                padding: 30px 24px !important;
            }

            .register-title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="login.html" class="logo">JyobiKen</a>
    </header>

    <main class="register-area">
        <div class="card register-card">
            <div class="card-body p-5">
                <div id="root"></div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        const { useState } = React;

        function Register() {

            const [name, setName] = useState("");
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [confirmPassword, setConfirmPassword] = useState("");

            const [errors, setErrors] = useState({});
            const [success, setSuccess] = useState(false);

            const handleSubmit = (e) => {

                e.preventDefault();

                const newErrors = {};

                if (!name.trim()) {
                    newErrors.name = "氏名を入力してください";
                }

                if (!email.trim()) {
                    newErrors.email = "メールアドレスを入力してください";
                } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    newErrors.email = "正しいメールアドレスを入力してください";
                }

                if (!password) {
                    newErrors.password = "パスワードを入力してください";
                } else if (password.length < 8) {
                    newErrors.password = "パスワードは8文字以上で入力してください";
                }

                if (!confirmPassword) {
                    newErrors.confirmPassword = "確認用パスワードを入力してください";
                } else if (password !== confirmPassword) {
                    newErrors.confirmPassword = "パスワードが一致しません";
                }

                setErrors(newErrors);
                setSuccess(false);

                if (Object.keys(newErrors).length === 0) {

                    setSuccess(true);

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                }
            };

            return (
                <>
                    {success && (
                        <div className="alert alert-success text-center mb-4">
                            登録しました
                        </div>
                    )}

                    <h1 className="register-title text-center mb-2">
                        アカウント作成
                    </h1>

                    <p className="description text-center mb-4">
                        必要な情報を入力して登録してください
                    </p>

                    <form onSubmit={handleSubmit} noValidate>

                        <div className="mb-3">
                            <label className="form-label fw-bold">氏名</label>
                            <input
                                type="text"
                                className="form-control"
                                placeholder="氏名を入力"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                            />
                            {errors.name && <p className="error-message">{errors.name}</p>}
                        </div>

                        <div className="mb-3">
                            <label className="form-label fw-bold">メールアドレス</label>
                            <input
                                type="email"
                                className="form-control"
                                placeholder="example@email.com"
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                            />
                            {errors.email && <p className="error-message">{errors.email}</p>}
                        </div>

                        <div className="mb-3">
                            <label className="form-label fw-bold">パスワード</label>
                            <input
                                type="password"
                                className="form-control"
                                placeholder="8文字以上で入力"
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                            />
                            {errors.password && <p className="error-message">{errors.password}</p>}
                        </div>

                        <div className="mb-3">
                            <label className="form-label fw-bold">パスワード（確認用）</label>
                            <input
                                type="password"
                                className="form-control"
                                placeholder="もう一度入力"
                                value={confirmPassword}
                                onChange={(e) => setConfirmPassword(e.target.value)}
                            />
                            {errors.confirmPassword && <p className="error-message">{errors.confirmPassword}</p>}
                        </div>

                        <div className="form-check my-4">
                            <input
                                type="checkbox"
                                className="form-check-input"
                                id="agreement"
                            />
                            <label className="form-check-label" htmlFor="agreement">
                                修了制作を受講します
                            </label>
                        </div>

                        <button
                            type="submit"
                            className="btn btn-primary w-100"
                            disabled={success}
                        >
                            登録する
                        </button>

                    </form>

                    <div className="text-center mt-4">
                        <p className="text-secondary small mb-2">
                            すでにアカウントをお持ちの方は
                        </p>

                        <a href="login.html" className="login-link">
                            ログインはこちら →
                        </a>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<Register />);

    </script>

    <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
