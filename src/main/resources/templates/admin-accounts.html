
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>アカウント管理 | JyobiKen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --blue: #42a9e8;
            --blue-hover: #2996d6;
        }

        body {
            margin: 0;
            background: #f3f6f9;
            color: #333;
            font-family: Arial, "Meiryo", sans-serif;
        }

        .sidebar {
            width: 190px;
            min-width: 190px;
            min-height: 100vh;
            padding: 22px 15px;
            background: white;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
        }

        .logo {
            color: #333;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .sidebar .nav-link {
            color: #555;
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: var(--blue-hover);
            background: #eaf6fd;
        }

        .logout {
            margin-top: auto;
            padding-top: 25px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .page-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .content-card {
            background: white;
            border: 1px solid #edf0f3;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,.04);
        }

        .form-control {
            border-color: #d1d5db;
            border-radius: 6px;
        }

        .btn-primary {
            background: var(--blue);
            border-color: var(--blue);
        }

        .btn-primary:hover {
            background: var(--blue-hover);
            border-color: var(--blue-hover);
        }

        .account-row {
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-top: 12px;
            background: #fff;
        }

        .account-name {
            font-weight: bold;
        }

        .account-number {
            font-size: 12px;
            color: #777;
        }

        @media (max-width: 767.98px) {
            .sidebar {
                width: 100%;
                min-width: 0;
                min-height: auto;
                border-right: 0;
                border-bottom: 1px solid #e5e7eb;
            }

            .logo {
                margin-bottom: 12px;
            }

            .sidebar .nav {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .logout {
                padding-top: 10px;
            }

            .main-content {
                padding: 20px 15px;
            }

            .content-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
<div class="d-flex flex-column flex-md-row">

    <aside class="sidebar">
        <a href="admin-home.html" class="logo">JyobiKen</a>

        <nav class="nav flex-column">
            <a href="admin-home.html" class="nav-link">卒業研究一覧</a>
            <a href="admin-accounts.html" class="nav-link active">アカウント管理</a>
            <a href="timeline.html" class="nav-link">タイムライン</a>
            <a href="notifications.html" class="nav-link">通知</a>
        </nav>

        <div class="logout">
            <a href="login.html" class="btn btn-outline-secondary btn-sm w-100">
                ログアウト →
            </a>
        </div>
    </aside>

    <main class="main-content">
        <h1 class="page-title">アカウント管理</h1>

        <section class="content-card">
            <label for="search" class="form-label">アカウント検索</label>

            <input type="search" id="search"
                   class="form-control mb-4"
                   placeholder="氏名・学籍番号で検索">

            <div id="account-list">

                <div class="account-row" data-search="山田花子 4523109">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div>
                            <div class="account-name">山田花子</div>
                            <div class="account-number">学籍番号：4523109</div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-danger btn-sm delete-account">
                                削除
                            </button>
                            <a href="admin-account-detail.html"
                               class="btn btn-outline-primary btn-sm">詳細 →</a>
                        </div>
                    </div>
                </div>

                <div class="account-row" data-search="山田花子 4523110">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div>
                            <div class="account-name">山田花子</div>
                            <div class="account-number">学籍番号：4523110</div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-danger btn-sm delete-account">
                                削除
                            </button>
                            <a href="admin-account-detail.html"
                               class="btn btn-outline-primary btn-sm">詳細 →</a>
                        </div>
                    </div>
                </div>

                <div class="account-row" data-search="山田花子 4523111">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div>
                            <div class="account-name">山田花子</div>
                            <div class="account-number">学籍番号：4523111</div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-danger btn-sm delete-account">
                                削除
                            </button>
                            <a href="admin-account-detail.html"
                               class="btn btn-outline-primary btn-sm">詳細 →</a>
                        </div>
                    </div>
                </div>

            </div>

            <p id="no-results" class="text-secondary text-center mt-4 d-none">
                該当するアカウントがありません。
            </p>
        </section>
    </main>
</div>

<script>
    const search = document.getElementById("search");
    const rows = document.querySelectorAll(".account-row");
    const noResults = document.getElementById("no-results");

    search.addEventListener("input", function () {
        let count = 0;
        rows.forEach(function (row) {
            const visible = row.dataset.search.includes(search.value.trim());
            row.classList.toggle("d-none", !visible);
            if (visible) count++;
        });
        noResults.classList.toggle("d-none", count > 0);
    });

    document.querySelectorAll(".delete-account").forEach(function (button) {
        button.addEventListener("click", function () {
            if (confirm("このアカウントを削除しますか？")) {
                button.closest(".account-row").remove();
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
