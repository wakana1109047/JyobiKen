
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>日誌投稿・編集 | JyobiKen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --main-blue: #42a9e8;
            --hover-blue: #2996d6;
        }

        body {
            margin: 0;
            background: #f3f6f9;
            color: #333;
            font-family: Arial, "Meiryo", sans-serif;
        }

        .sidebar {
            width: 190px;
            min-width: 190px;
            min-height: 100vh;
            background: #fff;
            border-right: 1px solid #e5e7eb;
            padding: 22px 15px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .sidebar .nav-link {
            color: #555;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: var(--hover-blue);
            background: #eaf6fd;
        }

        .logout {
            margin-top: auto;
            padding-top: 25px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .page-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .content-card {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .back-link {
            color: var(--hover-blue);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .form-label {
            font-weight: bold;
            font-size: 14px;
        }

        .form-control {
            border-color: #d1d5db;
            border-radius: 6px;
        }

        .form-control:focus {
            border-color: var(--main-blue);
            box-shadow: 0 0 0 0.2rem rgba(66, 169, 232, 0.15);
        }

        .diary-image {
            min-height: 220px;
            background: #e5e7eb;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: var(--main-blue);
            border-color: var(--main-blue);
        }

        .btn-primary:hover {
            background: var(--hover-blue);
            border-color: var(--hover-blue);
        }

        .campaign-link {
            display: block;
            margin: 25px 0;
            text-align: center;
            color: #2996d6;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .campaign-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 767.98px) {
            .sidebar {
                width: 100%;
                min-width: 0;
                min-height: auto;
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }

            .logo {
                margin-bottom: 12px;
            }

            .sidebar .nav {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .logout {
                padding-top: 10px;
            }

            .main-content {
                padding: 20px 15px;
            }

            .content-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="d-flex flex-column flex-md-row">

    <!-- 左メニュー -->
    <aside class="sidebar">
        <a href="#" class="logo">JyobiKen</a>

        <nav class="nav flex-column">
            <a href="research-list.html" class="nav-link">
                卒業研究一覧
            </a>
            <a href="#" class="nav-link">マイページ</a>
            <a href="#" class="nav-link active">タイムライン</a>
            <a href="#" class="nav-link">お知らせ</a>
        </nav>

        <div class="logout">
            <a href="login.html"
               class="btn btn-outline-secondary btn-sm w-100">
                ログアウト →
            </a>
        </div>
    </aside>

    <!-- 日誌投稿・編集 -->
    <main class="main-content">

        <div class="content-card">

            <a href="#" class="back-link">
                ← 戻る
            </a>

            <h1 class="page-title mt-3">日誌投稿・編集</h1>

            <form action="#" method="post">

                <div class="mb-4">
                    <label for="diary-title" class="form-label">
                        日誌タイトル
                    </label>

                    <input
                        type="text"
                        id="diary-title"
                        name="diary-title"
                        class="form-control"
                        placeholder="タイトルを入力してください"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="diary-content" class="form-label">
                        日誌の内容
                    </label>

                    <textarea
                        id="diary-content"
                        name="diary-content"
                        class="form-control"
                        rows="8"
                        placeholder="今日の活動内容を入力してください"
                        required
                    ></textarea>
                </div>

                <div class="mb-4">
                    <label for="diary-image" class="form-label">
                        写真
                    </label>

                    <input
                        type="file"
                        id="diary-image"
                        name="diary-image"
                        class="form-control"
                        accept="image/*"
                    >

                    <div class="form-text">
                        活動の写真を選択できます。
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="#" class="btn btn-outline-secondary">
                        キャンセル
                    </a>

                    <button type="submit" class="btn btn-primary">
                        保存する
                    </button>
                </div>

            </form>

            <a href="kanpu-register.html" class="campaign-link">
                カンプ登録のリンク
            </a>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
