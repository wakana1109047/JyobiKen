
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新規登録 | JyobiKen</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --main-blue: #42a9e8;
            --hover-blue: #2996d6;
        }

        body {
            margin: 0;
            font-family: Arial, "Meiryo", sans-serif;
            background-color: #f3f6f9;
            color: #333;
        }

        header {
            background-color: #fff;
            padding: 20px 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .register-area {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .register-title {
            font-size: 25px;
            font-weight: bold;
        }

        .description {
            color: #777;
            font-size: 14px;
        }

        .form-control {
            min-height: 44px;
            border-color: #d1d5db;
            border-radius: 6px;
        }

        .form-control:focus {
            border-color: var(--main-blue);
            box-shadow: 0 0 0 0.2rem rgba(66, 169, 232, 0.15);
        }

        .form-check-input {
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: var(--main-blue);
            border-color: var(--main-blue);
        }

        .btn-primary {
            min-height: 46px;
            background-color: var(--main-blue);
            border-color: var(--main-blue);
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: var(--hover-blue);
            border-color: var(--hover-blue);
        }

        .login-link {
            color: var(--hover-blue);
            font-weight: bold;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            header {
                padding: 18px 20px;
            }

            .register-card .card-body {
                padding: 30px 24px !important;
            }

            .register-title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <div class="logo">JyobiKen</div>
    </header>

    <!-- 新規登録フォーム -->
    <main class="register-area">

        <div class="card register-card">
            <div class="card-body p-5">

                <h1 class="register-title text-center mb-2">
                    アカウント作成
                </h1>

                <p class="description text-center mb-4">
                    必要な情報を入力して登録してください
                </p>

                <form action="#" method="post">

                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">
                            氏名
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            placeholder="氏名を入力"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">
                            メールアドレス
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">
                            パスワード
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="パスワードを入力"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password-confirm"
                               class="form-label fw-bold">
                            パスワード（確認用）
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password-confirm"
                            name="password-confirm"
                            placeholder="もう一度入力"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="form-check my-4">
                        <input
                            type="checkbox"
                            class="form-check-input"
                            id="agreement"
                            name="agreement"
                            required
                        >

                        <label class="form-check-label"
                               for="agreement">
                            修了制作を受講します
                        </label>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        登録する
                    </button>

                </form>

                <div class="text-center mt-4">
                    <p class="text-secondary small mb-2">
                        すでにアカウントをお持ちの方は
                    </p>

                    <a href="login.html" class="login-link">
                        ログインはこちら →
                    </a>
                </div>

            </div>
        </div>

    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
