
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>卒研詳細 | JyobiKen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --main-blue: #42a9e8;
            --hover-blue: #2996d6;
        }

        body {
            margin: 0;
            background: #f3f6f9;
            color: #333;
            font-family: Arial, "Meiryo", sans-serif;
        }

        .sidebar {
            width: 190px;
            min-width: 190px;
            min-height: 100vh;
            background: #fff;
            border-right: 1px solid #e5e7eb;
            padding: 22px 15px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .sidebar .nav-link {
            color: #555;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: var(--hover-blue);
            background: #eaf6fd;
        }

        .logout {
            margin-top: auto;
            padding-top: 25px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .page-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .content-card {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .back-link {
            color: var(--hover-blue);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .research-image {
            width: 100%;
            min-height: 180px;
            background: #e5e7eb;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            font-size: 20px;
            margin: 15px 0 20px;
        }

        .research-title {
            font-size: 23px;
            font-weight: bold;
        }

        .section-label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .member-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .member {
            background: #f3f6f9;
            border: 1px solid #e5e7eb;
            padding: 9px 13px;
            border-radius: 6px;
            font-size: 13px;
        }

        .research-description {
            min-height: 180px;
            background: #e5e7eb;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #666;
        }

        .btn-primary {
            background: var(--main-blue);
            border-color: var(--main-blue);
        }

        .btn-primary:hover {
            background: var(--hover-blue);
            border-color: var(--hover-blue);
        }

        @media (max-width: 767.98px) {
            .sidebar {
                width: 100%;
                min-width: 0;
                min-height: auto;
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }

            .logo {
                margin-bottom: 12px;
            }

            .sidebar .nav {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .logout {
                padding-top: 10px;
            }

            .main-content {
                padding: 20px 15px;
            }

            .content-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="d-flex flex-column flex-md-row">

    <!-- 左メニュー -->
    <aside class="sidebar">
        <a href="#" class="logo">JyobiKen</a>

        <nav class="nav flex-column">
            <a href="index.html" class="nav-link active">
                卒業研究一覧
            </a>
            <a href="#" class="nav-link">マイページ</a>
            <a href="#" class="nav-link">タイムライン</a>
            <a href="#" class="nav-link">お知らせ</a>
        </nav>

        <div class="logout">
            <a href="login.html"
               class="btn btn-outline-secondary btn-sm w-100">
                ログアウト →
            </a>
        </div>
    </aside>

    <!-- 詳細画面 -->
    <main class="main-content">

        <div class="content-card">

            <a href="index.html" class="back-link">
                ← 戻る
            </a>

            <div class="research-image">
                画像など
            </div>

            <h1 class="research-title">タイトル</h1>

            <p class="text-secondary small mb-4">
                グループA　2027年度卒業研究
            </p>

            <div class="mb-4">
                <h2 class="section-label">研究概要</h2>

                <div class="border rounded-2 p-3">
                    卒業研究の内容をここに表示します。
                </div>
            </div>

            <div class="mb-4">
                <h2 class="section-label">メンバー</h2>

                <div class="member-list">
                    <span class="member">👤 山田花子</span>
                    <span class="member">👤 山田花子</span>
                    <span class="member">👤 山田花子</span>
                    <span class="member">👤 山田花子</span>
                    <span class="member">👤 山田花子</span>
                </div>
            </div>

            <div class="research-description">
                研究内容・画像など
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="index.html"
                   class="btn btn-outline-secondary">
                    一覧に戻る
                </a>

                <a href="#" class="btn btn-primary">
                    編集する
                </a>
            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
